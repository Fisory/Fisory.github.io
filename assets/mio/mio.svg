<g class="head"><path fill="#a5bdd9" d="M43 56c1-32 23-48 48-46 32 1 52 22 47 63l-10 39-16 9H65l-17-18z"/><path fill="#f7e3d5" stroke="#c5aaa1" stroke-width="1" d="M58 53c-2 18-1 39 6 49 7 13 17 20 27 20s25-13 30-29l2-42z"/><path fill="#f6dece" d="M59 74q-15-5-10 11 4 8 12 5zm63 0q14-5 9 12-3 7-11 4z"/><path class="brow" fill="none" stroke="#74869a" stroke-linecap="round" stroke-width="1.4" d="m67 70 13-2m20 0 13 2"/>
<g class="eyes"><path fill="#fff" stroke="#62758b" stroke-width="1.2" d="M64 78q9-8 20-1-7 14-19 5zm32-1q10-7 20 1l-1 4q-12 9-19-5z"/><g class="iris"><ellipse cx="75" cy="80" rx="4.7" ry="7" fill="url(#iris)"/><ellipse cx="106" cy="80" rx="4.7" ry="7" fill="url(#iris)"/><ellipse cx="75" cy="79" rx="1.8" ry="4" fill="#213c67"/><ellipse cx="106" cy="79" rx="1.8" ry="4" fill="#213c67"/><circle cx="73.5" cy="76.5" r="1.8" fill="#fff"/><circle cx="104.5" cy="76.5" r="1.8" fill="#fff"/></g></g>
<path fill="none" stroke="#d3b2a3" stroke-linecap="round" d="m90 87-2 7h3"/><path class="mouth" fill="#dfafaa" stroke="#b48580" stroke-width=".8" d="M83 103q8 5 16-1-7 9-16 1z"/><ellipse fill="#efc2ba" opacity=".45" cx="67" cy="94" rx="7" ry="2.5"/><ellipse fill="#efc2ba" opacity=".45" cx="115" cy="94" rx="7" ry="2.5"/>
<path fill="url(#hair)" stroke="#9fb3ca" stroke-width="1.2" d="M43 59c-8-20 6-43 29-47l-8-6 18 5q27-10 43 14 25 5 14 37l-6 19-9-18-9-9 3 14-18-20 5 25-17-21-1 19-12-20-7 19-4-19-9 25-4 24-9-17z"/><path fill="none" stroke="#b0c3d9" stroke-width="1.1" d="M76 19 62 49m30-32-9 26m25-17 5 22"/><path class="hair-tip" fill="#d6e5f4" stroke="#a5bbd2" d="m124 34 15-10-3 22 8 10-14-3z"/><path fill="#77bbe1" d="m123 66 5 9-3 19-4-12z"/><circle fill="#79bee5" cx="127" cy="92" r="2"/></g>
<g fill="none" stroke="#83bfe7" stroke-width="1"><path d="m154 134 4-8 4 8-4 8z"/><circle cx="165" cy="119" r="2"/><path d="m20 76 3-5 3 5-3 5z"/></g>
</svg>
