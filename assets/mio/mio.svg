<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" role="img" aria-labelledby="title desc">
<title id="title">Mio</title><desc id="desc">白发蓝眼的异世界旅行者，穿着蓝白外套，能眨眼、看向画布并轻轻转头。</desc>
<defs><linearGradient id="coat" x2=".9" y2="1"><stop stop-color="#f6f9fe"/><stop offset="1" stop-color="#c9ddf2"/></linearGradient><linearGradient id="hair" x2=".7" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#c4d7ed"/></linearGradient><linearGradient id="iris" x2="0" y2="1"><stop stop-color="#365d9d"/><stop offset="1" stop-color="#72c5ed"/></linearGradient></defs>
<style>
svg{--gaze-x:0px;--gaze-y:0px;--head-tilt:-2deg;--blink-time:6.7s;overflow:visible}.body{transform-origin:90px 190px;animation:breathe 6s ease-in-out infinite}.head{transform-origin:90px 116px;transform:rotate(var(--head-tilt));transition:transform .7s ease}.eyes{transform-origin:90px 82px;animation:blink var(--blink-time) infinite}.iris{transform:translate(var(--gaze-x),var(--gaze-y));transition:transform .35s ease}.hair-tip{transform-origin:125px 42px;animation:sway 5s ease-in-out infinite}.mouth{transition:transform .2s ease;transform-origin:91px 104px}.speaking .mouth{animation:talk .25s alternate infinite}.curious .head{--head-tilt:6deg}.thinking .head{--head-tilt:-6deg}.happy .head{--head-tilt:3deg}.thinking .eyes{--blink-time:4.4s}.happy .brow{transform:translateY(-2px)}.hand{transform-origin:148px 179px;animation:wave 7s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-2px)}}@keyframes sway{50%{transform:rotate(3deg)}}@keyframes wave{40%,65%{transform:rotate(-5deg)}}@keyframes blink{0%,44%,47%,100%{transform:scaleY(1)}45%,46%{transform:scaleY(.06)}}@keyframes talk{to{transform:scaleY(1.9)}}@media(prefers-reduced-motion:reduce){.body,.eyes,.hair-tip,.hand,.mouth{animation:none!important}.head,.iris{transition:none}}
</style>
